<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROOM 0からの脱出 ― 透明な箱</title>
<style>
:root{
  --wall:#e9ecef;
  --wall2:#d7dce2;
  --floor:#c3c9d1;
  --ink:#1b1e23;
  --panel:#0d1014;
  --panel-ink:#d9e2ea;
  --mono:#8ef5c4;
  --amber:#ffd479;
  --alert:#ff6b5e;
  --ok:#63e6a0;
  --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:#05070a;
  color:var(--panel-ink);
  font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  max-width:1100px; margin:0 auto;
}

/* ---------- HUD ---------- */
#hud{
  flex:0 0 auto;
  display:flex; align-items:center; gap:12px;
  padding:10px 16px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px; letter-spacing:.14em;
  color:#7d8894;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:#080b0f;
}
#hud .rid{color:var(--mono)}
#hud .sp{flex:1}
#hud button{
  font:inherit; letter-spacing:.12em;
  background:transparent; color:#7d8894;
  border:1px solid rgba(255,255,255,.16);
  padding:4px 10px; border-radius:3px; cursor:pointer;
}
#hud button:hover{color:#cfd8e0;border-color:rgba(255,255,255,.4)}

/* ---------- STAGE ---------- */
#stage{
  position:relative; flex:1 1 auto; min-height:0;
  overflow:hidden;
  background:#0a0d11;
  transition:filter 1.2s ease;
}
#room{position:absolute; inset:0;}

.wall{
  position:absolute; inset:0;
  background:
    radial-gradient(120% 90% at 50% 26%, #f4f6f8 0%, var(--wall) 40%, var(--wall2) 72%, #b9c0c9 100%);
  transition:filter 1.4s ease, background 1.4s ease;
}
.floor{
  position:absolute; left:-10%; right:-10%; bottom:0; height:34%;
  background:linear-gradient(#b5bcc5,#98a1ab);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  transition:opacity 1s ease;
}
.floor::after{
  content:""; position:absolute; inset:0;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 9%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 26%);
  opacity:.5;
}
/* dimming */
#stage.dim .wall{filter:brightness(.16) saturate(.4)}
#stage.dim .floor{filter:brightness(.18)}
#stage.dim .obj:not(.lit){opacity:.14}
#stage.dim .obj.lit{filter:drop-shadow(0 0 34px rgba(255,255,255,.55))}

/* back panel that slides away — visually identical to the wall */
#backwall{
  position:absolute; left:0; right:0; top:0; bottom:34%;
  background:
    radial-gradient(120% 150% at 50% 40%, #f4f6f8 0%, var(--wall) 46%, var(--wall2) 78%, #bcc3cb 100%);
  transition:transform 3s cubic-bezier(.4,0,.2,1);
  z-index:3;
}
#backwall.notrans{transition:none}
#backwall.open{transform:translateX(-101%)}
#backwall .seam{position:absolute;right:0;top:0;bottom:0;width:1px;background:rgba(0,0,0,.10)}
#stage.dim #backwall{filter:brightness(.16) saturate(.4)}

/* reveal area behind wall — an adjoining chamber */
#reveal{position:absolute; left:0; right:0; top:0; bottom:34%; overflow:hidden; z-index:2;
  opacity:0; transition:opacity 1.2s;
  background:
    radial-gradient(90% 80% at 50% 62%, #e2e7ec 0%, #c8d0d8 48%, #99a4b0 100%);
  box-shadow:inset 0 0 120px rgba(30,45,60,.45);
}
#reveal.on{opacity:1}
#reveal::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:22%;
  background:linear-gradient(#9aa5b1,#7d8894);
}

/* ---------- objects ---------- */
.obj{
  position:absolute; cursor:pointer; z-index:5;
  transition:opacity .7s ease, transform .7s ease, filter .5s;
  -webkit-tap-highlight-color:transparent;
}
.obj.hidden{opacity:0; pointer-events:none; transform:translateY(8px)}
.obj:hover{filter:drop-shadow(0 0 12px rgba(90,190,255,.75))}
.obj .tag{
  position:absolute; left:50%; top:-6px; transform:translate(-50%,-100%);
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10px; letter-spacing:.14em;
  color:#22303c; background:rgba(255,255,255,.82); border:1px solid rgba(0,0,0,.14);
  padding:2px 7px; border-radius:2px; white-space:nowrap; opacity:0; transition:opacity .18s;
  pointer-events:none;
}
.obj:hover .tag{opacity:1}
.obj.done .tag{color:#5b6a76}
.obj .ring{
  position:absolute; inset:-10px; border:1px solid rgba(60,140,220,.0);
  border-radius:8px; transition:border-color .3s;
}
.obj.todo .ring{
  border-color:rgba(50,130,210,.55);
  animation:pulse 2.2s infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(50,130,210,.30)}50%{box-shadow:0 0 0 7px rgba(50,130,210,0)}}

/* ---------- text / monitor ---------- */
#ui{
  flex:0 0 auto;
  background:linear-gradient(180deg,#0b0e12,#070a0d);
  border-top:1px solid rgba(255,255,255,.10);
  padding:14px 18px 16px;
  max-height:52vh; overflow-y:auto;
}
#log{font-size:15.5px; line-height:1.95; color:#c9d3dc;}
#log p{margin:0 0 .55em}
#log p.think{color:#9fb0bf}
#log p.voice{color:#f0f4f8}
#log p.voice::before{content:"「"}
#log p.voice::after{content:"」"}
#log .sys{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:13px; line-height:1.8; letter-spacing:.04em;
  color:var(--mono); background:rgba(20,255,160,.05);
  border-left:2px solid rgba(20,255,160,.45);
  padding:9px 12px; margin:.5em 0 .8em; white-space:pre-wrap;
}
#log .sys.warn{color:var(--alert);background:rgba(255,90,80,.06);border-color:rgba(255,90,80,.5)}
#log .sys.hint{color:var(--amber);background:rgba(255,200,90,.06);border-color:rgba(255,200,90,.5)}
#log .sys.ok{color:var(--ok);background:rgba(90,230,150,.06);border-color:rgba(90,230,150,.5)}
#log .qhead{
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;
  letter-spacing:.22em; color:#6fd7ff; margin:1.1em 0 .35em;
  border-bottom:1px solid rgba(110,215,255,.25); padding-bottom:5px;
}
#log .obs{
  border-left:2px solid rgba(255,255,255,.18);
  padding:2px 0 2px 12px; margin:.3em 0 .8em; color:#b3c0cb;
}
#log .obs b{color:#e6eef5;font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.1em}

#choices{margin-top:10px; display:flex; flex-direction:column; gap:7px}
.btn{
  font-family:inherit; font-size:15px; text-align:left;
  color:#dbe4ec; background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.16); border-radius:4px;
  padding:11px 14px; cursor:pointer; transition:.16s;
  display:flex; gap:11px; align-items:baseline;
}
.btn:hover{background:rgba(110,215,255,.13); border-color:rgba(110,215,255,.55); color:#fff}
.btn .k{
  font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;
  color:#6fd7ff; letter-spacing:.1em; min-width:1.2em;
}
.btn:disabled{opacity:.34;cursor:default}
.btn.next{justify-content:center; color:#8ef5c4; border-color:rgba(140,245,196,.4)}
.btn.next:hover{background:rgba(140,245,196,.12);border-color:rgba(140,245,196,.9);color:#fff}
.btn.wrongpick{border-color:rgba(255,107,94,.55); color:#ff9d94; background:rgba(255,90,80,.06)}

#inputrow{display:flex; gap:8px; margin-top:10px}
#answer{
  flex:1; font-family:inherit; font-size:16px; color:#eaf2f8;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.22);
  border-radius:4px; padding:11px 13px; outline:none;
}
#answer:focus{border-color:rgba(110,215,255,.7)}
#send{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.1em;
  padding:0 18px;background:rgba(110,215,255,.14);color:#bfeaff;
  border:1px solid rgba(110,215,255,.5);border-radius:4px;cursor:pointer}
#send:hover{background:rgba(110,215,255,.28);color:#fff}

.hidden{display:none !important}

/* ---------- fx ---------- */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .5s}
#flash.on{opacity:1;transition:opacity .06s}

#counter{
  position:absolute; right:6%; top:12%; z-index:6;
  font-family:ui-monospace,Menlo,Consolas,monospace; text-align:right;
  color:#22303c; background:rgba(255,255,255,.72);
  border:1px solid rgba(0,0,0,.16); padding:12px 16px; border-radius:3px;
  box-shadow:0 6px 24px rgba(0,0,0,.14);
  opacity:0; transition:opacity .8s;
}
#counter.on{opacity:1}
#counter .lbl{font-size:10px;letter-spacing:.2em;color:#5c6b78}
#counter .val{font-size:34px;font-weight:600;letter-spacing:.02em;color:#12303f;line-height:1.15}
#counter .sub{font-size:10px;letter-spacing:.12em;color:#7b8894;margin-top:4px}
#counter.fixed .val{color:#1c6b3f}

/* strata */
#strata{
  position:absolute;left:0;right:0;bottom:0;height:34%;z-index:4;
  opacity:0;transition:opacity 1.6s ease;pointer-events:none;
}
#strata.on{opacity:1}

@media (max-width:820px){
  .obj{transform:scale(.72)}
  .obj.hidden{transform:scale(.72) translateY(8px)}
}
@media (max-width:640px){
  #log{font-size:14.5px;line-height:1.85}
  #ui{padding:12px 13px 14px; max-height:58vh}
  .btn{font-size:14px;padding:10px 12px}
  #counter{right:3%;top:6%;padding:8px 11px}
  #counter .val{font-size:24px}
  #counter .lbl,#counter .sub{font-size:9px}
  #log .sys{font-size:11.5px}
  .obj{transform:scale(.52)}
  .obj.hidden{transform:scale(.52) translateY(8px)}
}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="rid" id="hudRoom">ROOM 0</span>
    <span>|</span>
    <span id="hudStat">LOCKED</span>
    <span class="sp"></span>
    <span id="hudProg">Q 0 / 11</span>
    <button id="restart">RESTART</button>
  </div>

  <div id="stage">
    <div id="room">
      <div class="wall" id="wall"></div>
      <div class="floor" id="floorEl"></div>
      <svg id="strata" viewBox="0 0 1000 300" preserveAspectRatio="none"></svg>
      <div id="reveal"></div>
      <div id="backwall"><span class="seam"></span></div>
      <div id="objects"></div>
      <div id="counter"><div class="lbl">EARTH ATMOSPHERIC MASS</div><div class="val">83.7%</div><div class="sub" id="cSub">RELATIVE TO PRIMORDIAL</div></div>
    </div>
    <div id="flash"></div>
  </div>

  <div id="ui">
    <div id="log"></div>
    <div id="choices"></div>
    <div id="inputrow" class="hidden">
      <input id="answer" type="text" autocomplete="off" placeholder="答えを入力…">
      <button id="send">ENTER</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ROOM 0からの脱出 ― 透明な箱
   単一HTMLの探索型サイエンス脱出ゲーム
   ============================================================ */

/* ---------- SVG assets ---------- */
const ART = {
  door(locked){return `<svg width="118" height="215" viewBox="0 0 118 215">
    <rect x="4" y="4" width="110" height="207" rx="2" fill="#dfe4ea" stroke="#8d97a2" stroke-width="2"/>
    <rect x="14" y="16" width="90" height="183" fill="none" stroke="#aeb7c1" stroke-width="1.5"/>
    <circle cx="96" cy="112" r="5" fill="#7c8791"/>
    <circle cx="96" cy="92" r="6.5" fill="${locked?'#ff4b3d':'#2fd07a'}">
      <animate attributeName="opacity" values="1;.45;1" dur="${locked?'1.6s':'2.6s'}" repeatCount="indefinite"/>
    </circle>
    <text x="59" y="34" font-family="monospace" font-size="10" letter-spacing="2" text-anchor="middle" fill="${locked?'#c0392b':'#1e8b55'}">${locked?'LOCKED':'UNLOCKED'}</text>
  </svg>`},
  doorOpen(){return `<svg width="118" height="215" viewBox="0 0 118 215">
    <rect x="4" y="4" width="110" height="207" rx="2" fill="#12171c" stroke="#8d97a2" stroke-width="2"/>
    <rect x="4" y="4" width="34" height="207" fill="#cfd6dd" stroke="#8d97a2" stroke-width="1.5"/>
    <rect x="46" y="20" width="60" height="180" fill="#0a0e12"/>
    <text x="76" y="112" font-family="monospace" font-size="10" letter-spacing="3" text-anchor="middle" fill="#2fd07a">ENTER</text>
  </svg>`},
  desk(open){return `<svg width="230" height="120" viewBox="0 0 230 120">
    <rect x="6" y="18" width="218" height="13" rx="2" fill="#e7ebef" stroke="#98a2ac" stroke-width="1.5"/>
    <rect x="20" y="31" width="190" height="34" fill="#dde3e9" stroke="#a3adb7" stroke-width="1.2"/>
    <rect x="${open?'-46':'30'}" y="38" width="80" height="20" rx="1.5" fill="#cfd6dd" stroke="#939da8" stroke-width="1.2" style="transition:x 1s"/>
    ${open?'<rect x="-38" y="43" width="26" height="10" rx="2" fill="#3b4a57"/><rect x="-34" y="45.5" width="7" height="5" fill="#7ee08f"/>':''}
    <rect x="24" y="65" width="9" height="50" fill="#c3ccd5"/>
    <rect x="197" y="65" width="9" height="50" fill="#c3ccd5"/>
  </svg>`},
  box(g){ // g: 0..1 growth
    const h = 12 + g*46, w = 5 + g*16;
    let leaves = '';
    const n = 2 + Math.round(g*5);
    for(let i=0;i<n;i++){
      const y = 74 - (i+1)*(h/(n+0.6));
      const s = (0.5+g)*(9+i*2.2);
      const d = i%2?1:-1;
      leaves += `<ellipse cx="${60+d*(s*0.72)}" cy="${y}" rx="${s}" ry="${s*0.42}" fill="#4f9d5a" opacity=".92" transform="rotate(${d*-22} ${60+d*(s*0.72)} ${y})"/>`;
    }
    return `<svg width="120" height="120" viewBox="0 0 120 120">
      <rect x="12" y="10" width="96" height="88" rx="2" fill="rgba(190,225,240,.30)" stroke="#9fb3bf" stroke-width="1.6"/>
      <line x1="12" y1="10" x2="30" y2="2" stroke="#9fb3bf" stroke-width="1.2"/>
      <line x1="108" y1="10" x2="126" y2="2" stroke="#9fb3bf" stroke-width="1.2" opacity=".5"/>
      <rect x="20" y="74" width="80" height="22" fill="#7a6350"/>
      <rect x="20" y="74" width="80" height="4" fill="#8d7561"/>
      <rect x="${59-w/2*0.18}" y="${74-h}" width="${2.6+g*2}" height="${h}" fill="#3f7a48"/>
      ${leaves}
      <rect x="12" y="96" width="96" height="4" fill="#aab8c2"/>
    </svg>`},
  monitor(txt,color){return `<svg width="180" height="118" viewBox="0 0 180 118">
    <rect x="2" y="2" width="176" height="106" rx="3" fill="#12181e" stroke="#7f8a95" stroke-width="2"/>
    <rect x="9" y="9" width="162" height="92" fill="#0a1014"/>
    <text x="90" y="52" font-family="monospace" font-size="13" letter-spacing="2.5" text-anchor="middle" fill="${color||'#7ef5c0'}">${txt||'EXIT TEST'}</text>
    <text x="90" y="70" font-family="monospace" font-size="8" letter-spacing="2" text-anchor="middle" fill="#3f7a63">SYSTEM ONLINE</text>
    <rect x="9" y="9" width="162" height="92" fill="url(#sc)" opacity=".25"/>
    <defs><pattern id="sc" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1.2" fill="#000"/></pattern></defs>
  </svg>`},
  battery(){return `<svg width="76" height="46" viewBox="0 0 76 46">
    <rect x="3" y="8" width="62" height="30" rx="4" fill="#2f3d49" stroke="#9aa5b0" stroke-width="1.6"/>
    <rect x="65" y="17" width="7" height="12" rx="2" fill="#9aa5b0"/>
    <rect x="8" y="13" width="12" height="20" fill="#7ee08f"/>
    <text x="42" y="29" font-family="monospace" font-size="10" text-anchor="middle" fill="#cfe6d8">0%</text>
  </svg>`},
  tree(scale,burn){
    const s = scale||1;
    if(burn===2) return `<svg width="300" height="330" viewBox="0 0 300 330">
      <ellipse cx="150" cy="306" rx="86" ry="15" fill="#6b6157"/>
      <ellipse cx="150" cy="303" rx="60" ry="10" fill="#8a8177"/>
      <path d="M120 300 h60 l-6 -14 h-48 z" fill="#4a443d"/>
      <ellipse cx="150" cy="270" rx="200" ry="8" fill="none"/>
    </svg>`;
    return `<svg width="300" height="330" viewBox="0 0 300 330">
      <defs>
        <radialGradient id="fol"><stop offset="0%" stop-color="#6fbf6e"/><stop offset="100%" stop-color="#2f6b3a"/></radialGradient>
        <radialGradient id="fire" cx="50%" cy="80%"><stop offset="0%" stop-color="#fff3b0"/><stop offset="45%" stop-color="#ff9b21"/><stop offset="100%" stop-color="rgba(200,40,0,0)"/></radialGradient>
      </defs>
      <ellipse cx="150" cy="292" rx="92" ry="20" fill="#8a6a4d"/>
      <path d="M104 292 q46 -22 92 0 l-12 -34 h-68 z" fill="#7b5a3f"/>
      <path d="M138 268 q-8 -80 4 -128 q10 46 18 128 z" fill="#6d523a"/>
      <path d="M146 176 l-42 -34 M152 152 l40 -30 M148 208 l-36 -22" stroke="#6d523a" stroke-width="7" fill="none" stroke-linecap="round"/>
      <g opacity="${burn?0.25:1}" style="transition:opacity 2s">
        <circle cx="150" cy="106" r="72" fill="url(#fol)"/>
        <circle cx="96" cy="140" r="40" fill="url(#fol)"/>
        <circle cx="206" cy="140" r="44" fill="url(#fol)"/>
      </g>
      ${burn===1?`<g>
        <ellipse cx="150" cy="200" rx="70" ry="120" fill="url(#fire)" opacity=".92">
          <animate attributeName="ry" values="120;138;118;132;120" dur="1.1s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".9;1;.8;.95;.9" dur=".7s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="150" cy="240" rx="42" ry="80" fill="#ffd66b" opacity=".75">
          <animate attributeName="ry" values="80;96;76;88;80" dur=".8s" repeatCount="indefinite"/>
        </ellipse>
      </g>`:''}
    </svg>`},
  bag(){return `<svg width="120" height="130" viewBox="0 0 120 130">
    <path d="M28 22 h64 l14 84 q-46 18 -92 0 z" fill="rgba(200,230,245,.34)" stroke="#a9bcc8" stroke-width="1.6"/>
    <rect x="46" y="10" width="28" height="14" rx="3" fill="#c9d5de" stroke="#9aa9b4"/>
    <text x="60" y="70" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#5e7280">1 m³</text>
  </svg>`},
  panelData(lines){
    const rows = lines.map((l,i)=>`<text x="14" y="${28+i*22}" font-family="monospace" font-size="12" fill="${l[1]||'#7ef5c0'}">${l[0]}</text>`).join('');
    return `<svg width="230" height="${22*lines.length+22}" viewBox="0 0 230 ${22*lines.length+22}">
      <rect x="1" y="1" width="228" height="${22*lines.length+20}" rx="3" fill="#0d1318" stroke="#7f8a95" stroke-width="1.6"/>${rows}</svg>`},
  globe(){return `<svg width="180" height="210" viewBox="0 0 180 210">
    <defs><radialGradient id="gl" cx="35%" cy="30%"><stop offset="0%" stop-color="#7fc6ff"/><stop offset="70%" stop-color="#2b6ea8"/><stop offset="100%" stop-color="#123048"/></radialGradient></defs>
    <ellipse cx="90" cy="196" rx="46" ry="9" fill="#96a0aa"/>
    <rect x="82" y="150" width="16" height="44" fill="#b7c0c9"/>
    <circle cx="90" cy="94" r="72" fill="url(#gl)"/>
    <path d="M40 70 q26 -20 52 -6 q20 10 8 26 q-16 20 -44 12 q-24 -8 -16 -32z" fill="#4e9a63" opacity=".85"/>
    <path d="M104 118 q26 -8 40 10 q10 18 -12 26 q-26 8 -34 -12 q-6 -16 6 -24z" fill="#4e9a63" opacity=".85"/>
    <ellipse cx="90" cy="94" rx="80" ry="80" fill="none" stroke="rgba(160,215,255,.55)" stroke-width="7" opacity=".55">
      <animate attributeName="stroke-width" values="7;4;7" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="90" cy="94" rx="72" ry="72" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
  </svg>`},
  wallScreen(a,b,c){return `<svg width="210" height="120" viewBox="0 0 210 120">
    <rect x="2" y="2" width="206" height="116" rx="3" fill="#0d1318" stroke="#7f8a95" stroke-width="1.8"/>
    <text x="105" y="26" font-family="monospace" font-size="9" letter-spacing="2" text-anchor="middle" fill="#4f8fa8">${a}</text>
    <text x="105" y="66" font-family="monospace" font-size="26" letter-spacing="1" text-anchor="middle" fill="#7ef5c0">${b}</text>
    <text x="105" y="96" font-family="monospace" font-size="9" letter-spacing="2" text-anchor="middle" fill="#4f8fa8">${c}</text>
  </svg>`},
  rockSample(){return `<svg width="110" height="90" viewBox="0 0 110 90">

/* ---------- state ---------- */
const S = {
  step:0, growth:0, burn:0, qDone:0, qTotal:12,
  inspected:new Set(), needed:new Set(), waiting:null, atm:83.7, atmTimer:null
};

const el = id => document.getElementById(id);
const logEl = el('log'), choicesEl = el('choices'), objectsEl = el('objects');

/* ---------- rendering helpers ---------- */
function scrollLog(){ el('ui').scrollTop = el('ui').scrollHeight; }
function line(text, cls){
  const p = document.createElement('p');
  if(cls) p.className = cls;
  p.textContent = text;
  logEl.appendChild(p); scrollLog(); return p;
}
function sys(text, kind){
  const d = document.createElement('div');
  d.className = 'sys' + (kind?(' '+kind):'');
  d.textContent = text;
  logEl.appendChild(d); scrollLog(); return d;
}
function qhead(t){
  const d = document.createElement('div'); d.className='qhead'; d.textContent=t;
  logEl.appendChild(d); scrollLog();
}
function obs(name, text){
  const d = document.createElement('div'); d.className='obs';
  d.innerHTML = '<b>'+name+'</b><br>';
  d.appendChild(document.createTextNode(text));
  logEl.appendChild(d); scrollLog();
}
function clearChoices(){ choicesEl.innerHTML=''; el('inputrow').classList.add('hidden'); }
function button(label, key, fn, cls){
  const b = document.createElement('button');
  b.className = 'btn' + (cls?(' '+cls):'');
  if(key) b.innerHTML = '<span class="k">'+key+'</span>';
  b.appendChild(document.createTextNode(label));
  b.onclick = ()=>fn(b);
  choicesEl.appendChild(b); scrollLog(); return b;
}
function nextBtn(label, fn){ clearChoices(); button(label||'▸ 進む', null, ()=>{clearChoices(); fn();}, 'next'); }
function updHud(){
  el('hudProg').textContent = 'Q '+S.qDone+' / '+S.qTotal;
}

/* ---------- objects ---------- */
function placeObject(o){
  const d = document.createElement('div');
  d.className = 'obj' + (o.hidden?' hidden':'');
  d.id = 'obj-'+o.id;
  d.style.left = o.x; d.style.top = o.y;
  if(o.w) d.style.width = o.w;
  d.innerHTML = '<span class="ring"></span><span class="tag">'+o.tag+'</span><div class="art">'+o.art()+'</div>';
  d.onclick = ()=>inspect(o);
  d._data = o;
  objectsEl.appendChild(d);
  return d;
}
function setObjects(list){
  objectsEl.innerHTML='';
  list.forEach(placeObject);
}
function redraw(id, html){
  const n = document.querySelector('#obj-'+id+' .art');
  if(n) n.innerHTML = html;
}
function show(id, on){
  const n = el('obj-'+id);
  if(n) n.classList.toggle('hidden', !on);
}
function lit(ids){
  document.querySelectorAll('.obj').forEach(n=>n.classList.remove('lit'));
  (ids||[]).forEach(i=>{ const n=el('obj-'+i); if(n) n.classList.add('lit'); });
}
function markTodo(ids){
  document.querySelectorAll('.obj').forEach(n=>n.classList.remove('todo'));
  (ids||[]).forEach(i=>{ const n=el('obj-'+i); if(n && !S.inspected.has(i)) n.classList.add('todo'); });
}

function inspect(o){
  const node = el('obj-'+o.id);
  if(o.onClick){ o.onClick(); return; }
  const key = o.id;
  const txt = (typeof o.look==='function') ? o.look() : o.look;
  obs(o.tag, txt);
  if(o.after) o.after();
  if(!S.inspected.has(key)){
    S.inspected.add(key);
    if(node){ node.classList.add('done'); node.classList.remove('todo'); }
    if(S.waiting){
      const w = S.waiting;
      if(w.need.every(n=>S.inspected.has(n))){
        S.waiting = null;
        markTodo([]);
        setTimeout(()=>{ clearChoices(); w.fn(); }, 420);
      }
    }
  }
}

/* wait until the listed objects have been examined */
function requireLook(need, prompt, fn){
  clearChoices();
  const rest = need.filter(n=>!S.inspected.has(n));
  if(rest.length===0){ fn(); return; }
  markTodo(rest);
  S.waiting = {need, fn};
  const p = line(prompt || '― 部屋を調べる。（光っている物をクリック）', 'think');
  p.style.opacity = .8;
}

/* ---------- question engine ---------- */
const KEYS = ['A','B','C','D','E'];
function question(cfg){
  // cfg: {no, title, body[], choices[], correct(index|null), hints[], explain[], accepted?, onDone}
  clearChoices();
  if(cfg.no) qhead(cfg.no);
  (cfg.body||[]).forEach(b=>{
    if(typeof b === 'string') line(b);
    else if(b.sys) sys(b.sys, b.kind);
    else if(b.think) line(b.think,'think');
    else if(b.voice) line(b.voice,'voice');
  });
  let hintIdx = 0;
  const render = ()=>{
    clearChoices();
    cfg.choices.forEach((c,i)=>{
      button(c, KEYS[i], (btn)=>{
        if(cfg.correct===null || cfg.correct===undefined){
          // no judgement
          Array.from(choicesEl.children).forEach(b=>b.disabled=true);
          S.qDone++; updHud();
          sys('回答を受理しました。');
          setTimeout(()=>{ clearChoices(); finish(i); }, 500);
          return;
        }
        if(i===cfg.correct){
          Array.from(choicesEl.children).forEach(b=>b.disabled=true);
          S.qDone++; updHud();
          sys('《正解》','ok');
          setTimeout(()=>{ clearChoices(); finish(i); }, 500);
        }else{
          btn.classList.add('wrongpick'); btn.disabled = true;
          sys('《不正解》','warn');
          const h = (cfg.hints||[])[hintIdx];
          if(h){
            hintIdx++;
            // freeze input until the hint has been printed, so the log stays in order
            const frozen = Array.from(choicesEl.children).filter(b=>!b.disabled);
            frozen.forEach(b=>b.disabled=true);
            setTimeout(()=>{
              if(h.fx) h.fx();
              if(h.sys) sys(h.sys,'hint');
              (h.text||[]).forEach(t=> typeof t==='string'? line(t) : line(t.think,'think'));
              frozen.forEach(b=>b.disabled=false);
            }, 520);
          }
        }
      });
    });
  };
  const finish = (picked)=>{
    (cfg.explain||[]).forEach(b=>{
      if(typeof b === 'string') line(b);
      else if(b.sys) sys(b.sys, b.kind);
      else if(b.think) line(b.think,'think');
      else if(b.voice) line(b.voice,'voice');
    });
    if(cfg.onDone) cfg.onDone(picked);
  };
  render();
}

function freeAnswer(cfg){
  // cfg: {no, body[], accept:[regex], wrong:[msgs], explain[], onDone}
  clearChoices();
  if(cfg.no) qhead(cfg.no);
  (cfg.body||[]).forEach(b=>{
    if(typeof b === 'string') line(b);
    else if(b.sys) sys(b.sys, b.kind);
    else if(b.think) line(b.think,'think');
    else if(b.voice) line(b.voice,'voice');
  });
  const row = el('inputrow');
  row.classList.remove('hidden');
  const inp = el('answer'); inp.value=''; inp.placeholder = cfg.placeholder||'答えを入力…';
  setTimeout(()=>inp.focus(),100);
  let miss = 0;
  const submit = ()=>{
    const v = inp.value.trim();
    if(!v) return;
    line(v,'voice');
    inp.value='';
    if(cfg.accept.some(r=>r.test(v))){
      row.classList.add('hidden');
      S.qDone++; updHud();
      sys('《正解》','ok');
      setTimeout(()=>{
        (cfg.explain||[]).forEach(b=>{
          if(typeof b === 'string') line(b);
          else if(b.sys) sys(b.sys, b.kind);
          else if(b.think) line(b.think,'think');
          else if(b.voice) line(b.voice,'voice');
        });
        if(cfg.onDone) cfg.onDone();
      }, 500);
    }else{
      sys('《該当なし》','warn');
      const h = (cfg.wrong||[])[Math.min(miss,(cfg.wrong||[]).length-1)];
      if(h) setTimeout(()=>sys(h,'hint'), 400);
      miss++;
      inp.focus();
    }
  };
  el('send').onclick = submit;
  inp.onkeydown = e=>{ if(e.key==='Enter') submit(); };
}

/* ---------- effects ---------- */
function flash(ms){
  const f = el('flash'); f.classList.add('on');
  setTimeout(()=>f.classList.remove('on'), ms||110);
}
function dim(on){ el('stage').classList.toggle('dim', !!on); }
function growTo(target, dur, done){
  const start = S.growth, t0 = performance.now();
  function tick(t){
    const k = Math.min(1,(t-t0)/dur);
    S.growth = start + (target-start)*k;
    redraw('box', ART.box(S.growth));
    if(k<1) requestAnimationFrame(tick); else if(done) done();
  }
  requestAnimationFrame(tick);
}
function runCounter(from, to, dur, done){
  if(S.atmTimer) cancelAnimationFrame(S.atmTimer);
  const t0 = performance.now();
  const v = el('counter').querySelector('.val');
  el('counter').classList.add('on');
  function tick(t){
    const k = Math.min(1,(t-t0)/dur);
    const e = 1-Math.pow(1-k,2.2);
    const val = from + (to-from)*e;
    S.atm = val;
    v.textContent = val.toFixed(1)+'%';
    if(k<1) S.atmTimer = requestAnimationFrame(tick);
    else { S.atm = to; S.atmTimer = null; if(done) done(); }
  }
  S.atmTimer = requestAnimationFrame(tick);
}
/* slow, never-ending drift so the room keeps feeling alive */
function driftCounter(rate){
  if(S.drift) clearInterval(S.drift);
  S.drift = setInterval(()=>{
    if(S.atmTimer || S.atmLocked) return;
    S.atm = Math.max(1.0, S.atm - rate);
    el('counter').querySelector('.val').textContent = S.atm.toFixed(1)+'%';
  }, 700);
}
function drawStrata(){
  const bands = [
    ['#a89c85',0,26],['#bdb298',26,20],['#8e836d',46,14],
    ['#d9d3c4',60,42],['#cfc7b4',102,34],['#b9b09b',136,26],
    ['#e2ddd0',162,50],['#c6bda8',212,44],['#a49a84',256,44]
  ];
  let s='';
  bands.forEach(([c,y,h],i)=>{
    s += `<rect x="0" y="${y}" width="1000" height="${h}" fill="${c}"/>`;
    if(i>3) s += `<g opacity=".55">`+Array.from({length:16},(_,j)=>{
      const cx = 30+j*62+(i%2)*24, cy = y+h*0.5+((j%3)-1)*5;
      return `<ellipse cx="${cx}" cy="${cy}" rx="7" ry="3" fill="#f3efe4"/><circle cx="${cx+22}" cy="${cy+2}" r="2.6" fill="#f3efe4"/>`;
    }).join('')+`</g>`;
  });
  s += `<text x="500" y="184" font-family="monospace" font-size="15" letter-spacing="5" text-anchor="middle" fill="#5d5546">L I M E S T O N E</text>`;
  s += `<text x="500" y="204" font-family="monospace" font-size="11" letter-spacing="3" text-anchor="middle" fill="#7a7161">CaCO₃</text>`;
  const st = el('strata'); st.innerHTML = s; st.classList.add('on');
}
